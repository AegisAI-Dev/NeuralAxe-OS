
<div *ngIf="form != null" class="card">
    <form [formGroup]="form">
        <div class="flex justify-content-between flex-column md:align-items-center md:flex-row mb-1">
            <h2 class="nx-page-title mb-0">
                Logs
            </h2>

            <nav class="flex gap-3 w-full md:w-6">
                <span class="w-full p-input-icon-left">
                    <i class="pi pi-filter"></i>
                    <input
                        pInputText
                        type="text"
                        class="w-full"
                        autocomplete="off"
                        placeholder="Case-sensitive filter"
                        id="filter"
                        formControlName="filter"/>
                </span>
                <p-button
                    pp-button
                    icon="pi pi-{{stopScroll ? 'play' : 'pause'}}"
                    (click)="stopScroll = !stopScroll"
                    pTooltip="{{stopScroll ? 'Start' : 'Stop'}} Scrolling"
                    tooltipPosition="left">
                </p-button>
                <p-button
                    pp-button
                    icon="pi pi-{{loadingLogs ? 'spinner pi-spin' : 'download'}}"
                    [disabled]="loadingLogs"
                    (click)="downloadLogs()"
                    pTooltip="Download Logs"
                    tooltipPosition="left">
                </p-button>
                <p-button
                    pp-button
                    icon="pi pi-trash"
                    (click)="clearLogs()"
                    pTooltip="Clear Logs"
                    tooltipPosition="left">
                </p-button>

            </nav>
        </div>

        <p class="nx-page-desc">
            Live serial output from the device, streamed over WebSocket. The most recent
            256 lines are kept; use the filter to narrow output, pause to inspect, or
            download the full log from the device.
        </p>

        <div id="logs" #scrollContainer>
            <div *ngIf="!logs.length" class="text-500 p-3">
                Waiting for log output&hellip; New lines appear here as the device emits them.
            </div>
            <div *ngFor="let log of logs" [ngClass]="log.className">&rsaquo; {{log.text | ANSI}}</div>
        </div>
    </form>
</div>
