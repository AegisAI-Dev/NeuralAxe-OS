<div [ngClass]="{'card': (form$ | async), 'hidden': !(form$ | async)}">
    <h2>Settings</h2>

    <p class="nx-page-desc">
        Device settings for this miner: frequency and voltage, thermal and fan control,
        display and statistics. Pool settings are on the Pools page; Wi-Fi and hostname
        are on the Network page. Changes apply only after you press Save.
    </p>

    <app-edit></app-edit>
</div>
