openapi: 3.1.0
info:
  title: ESP-Miner API
  description: API specification for ESP-Miner HTTP server
  version: 1.0.0
  license:
    name: GNU General Public License version 3
    url: https://opensource.org/license/gpl-3-0

servers:
  - url: http://{device_ip}
    description: ESP-Miner device
    variables:
      device_ip:
        default: "192.168.1.1"
        description: IP address of the ESP-Miner device

components:
  schemas:
    GenericResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    SharesRejectedReason:
      type: object
      required:
        - message
        - count
      properties:
        message:
          type: string
          description: Rejection reason from pool
          examples:
            - "Job not found"
        count:
          type: integer
          description: Shares rejected for this reason
    WifiNetwork:
      type: object
      required:
        - ssid
        - rssi
        - authmode
      properties:
        ssid:
          type: string
          description: Network SSID
          examples:
            - "MyWiFiNetwork"
        rssi:
          type: integer
          description: Signal strength in dBm
          examples:
            - -65
        authmode:
          type: integer
          minimum: 0
          maximum: 12
          enum:
            - 0  # WIFI_AUTH_OPEN
            - 1  # WIFI_AUTH_WEP
            - 2  # WIFI_AUTH_WPA_PSK
            - 3  # WIFI_AUTH_WPA2_PSK
            - 4  # WIFI_AUTH_WPA_WPA2_PSK
            - 5  # WIFI_AUTH_WPA2_ENTERPRISE
            - 6  # WIFI_AUTH_WPA3_PSK
            - 7  # WIFI_AUTH_WPA2_WPA3_PSK
            - 8  # WIFI_AUTH_WAPI_PSK
            - 9  # WIFI_AUTH_OWE
            - 10 # WIFI_AUTH_WPA3_ENT_192
            - 11 # WIFI_AUTH_WPA3_PSK_192 (deprecated)
            - 12 # WIFI_AUTH_WPA3_EXT_PSK (deprecated)
          description: |
            Authentication mode:
            * 0 - OPEN
            * 1 - WEP
            * 2 - WPA_PSK
            * 3 - WPA2_PSK
            * 4 - WPA_WPA2_PSK
            * 5 - WPA2_ENTERPRISE
            * 6 - WPA3_PSK
            * 7 - WPA2_WPA3_PSK
            * 8 - WAPI_PSK
            * 9 - OWE (Opportunistic Wireless Encryption)
            * 10 - WPA3_ENT_192 (Enterprise Suite-B)
            * 11 - WPA3_PSK_192 (deprecated, use WPA3_PSK)
            * 12 - WPA3_EXT_PSK (deprecated, use WPA3_PSK)
          examples:
            - 3
    HashrateMonitorAsic:
      type: object
      required:
        - total
        - domains
        - errorCount
      properties:
        total:
          type: number
          description: Hashrate
        domains:
          type: array
          description: Hashrate per domain
          items:
            type: number
        errorCount:
          description: Number of errors
          type: number

    FanCurvePoint:
      type: object
      required:
        - tempC
        - fanPercent
      properties:
        tempC:
          type: integer
          minimum: 20
          maximum: 70
          description: Curve point temperature in °C (board-601 bounds; the final point stays at least 5 °C below the 75 °C hard-throttle limit)
        fanPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Fan duty percentage at this temperature

    SystemInfo:
      type: object
      required:
        - ASICModel
        - apEnabled
        - autofanspeed
        - bestDiff
        - bestSessionDiff
        - boardVersion
        - coreVoltage
        - coreVoltageActual
        - current
        - display
        - fallbackStratumExtranonceSubscribe
        - fallbackStratumPort
        - fallbackStratumSuggestedDifficulty
        - fallbackStratumURL
        - fallbackStratumUser
        - fallbackStratumTLS
        - fallbackStratumCert
        - fallbackStratumDecodeCoinbase
        - fanrpm
        - fan2rpm
        - fanspeed
        - temptarget
        - thermalControlMode
        - fanCurve
        - fanCurveHysteresis
        - effectiveControlTemperature
        - requestedFanPercent
        - appliedFanPercent
        - activeCurveSegment
        - thermalControlReason
        - emergencyOverrideActive
        - hysteresisHolding
        - controlSensor
        - controlSensorValid
        - rotation
        - cpuUsage
        - freeHeap
        - freeHeapInternal
        - freeHeapSpiram
        - frequency
        - actualFrequency
        - hashRate
        - hashRate_1m
        - hashRate_10m
        - hashRate_1h
        - expectedHashrate
        - errorPercentage
        - hostname
        - idfVersion
        - invertscreen
        - isPSRAMAvailable
        - isUsingFallbackStratum
        - macAddr
        - manualFanSpeed
        - maxPower
        - minFanSpeed
        - nominalVoltage
        - overheat_mode
        - overclockEnabled
        - poolConnectionInfo
        - poolDifficulty
        - power
        - resetReason
        - responseTime
        - runningPartition
        - sharesAccepted
        - sharesRejected
        - sharesRejectedReasons
        - smallCoreCount
        - ssid
        - ipv4
        - ipv6
        - stratumExtranonceSubscribe
        - stratumPort
        - stratumProtocol
        - stratumV2AuthorityPubkey
        - stratumSuggestedDifficulty
        - stratumURL
        - stratumUser
        - stratumTLS
        - stratumCert
        - stratumDecodeCoinbase
        - temp
        - temp2
        - uptimeSeconds
        - version
        - axeOSVersion
        - voltage
        - vrTemp
        - wifiStatus
        - wifiRSSI
        - displayTimeout
        - statsFrequency
        - blockHeight
        - scriptsig
        - networkDifficulty
        - blockSignals
        - blockFound
        - coinbaseOutputs
        - coinbaseValueTotalSatoshis
        - coinbaseValueUserSatoshis
        - hashrateMonitor
        - miningPaused
        - statsLimit
      properties:
        ASICModel:
          type: string
          description: ASIC model identifier
        apEnabled:
          type: number
          description: Whether AP mode is enabled (0=no, 1=yes)
        autofanspeed:
          type: number
          description: Automatic fan speed control (0=manual, 1=auto)
        bestDiff:
          type: number
          description: Best difficulty achieved
        bestSessionDiff:
          type: number
          description: Best difficulty achieved in current session
        boardVersion:
          type: string
          description: Hardware board version
        coreVoltage:
          type: number
          description: Configured ASIC core voltage
        coreVoltageActual:
          type: number
          description: Actual measured ASIC core voltage
        current:
          type: number
          description: Current draw in milliamps
        display:
          type: string
          description: The configured display
        fallbackStratumExtranonceSubscribe:
          type: boolean
          description: Enable fallback pool extranonce subscription
        fallbackStratumPort:
          type: number
          description: Fallback stratum server port
        fallbackStratumSuggestedDifficulty:
          type: number
          description: Fallback pool suggested difficulty
        fallbackStratumURL:
          type: string
          description: Fallback stratum server URL
        fallbackStratumUser:
          type: string
          description: Fallback stratum username
        fallbackStratumTLS:
          type: boolean
          description: Enable fallback stratum TLS
        fallbackStratumCert:
          type: string
          description: Fallback stratum TLS cert
        fallbackStratumDecodeCoinbase:
          type: boolean
          description: Enable fallback pool coinbase transaction decoding
        fallbackStratumProtocol:
          type: string
          enum: [SV1, SV2]
          description: Configured fallback stratum protocol
        fallbackStratumV2AuthorityPubkey:
          type: string
          description: Fallback SV2 authority public key for certificate verification (base58-encoded)
        fallbackStratumV2ChannelType:
          type: string
          enum: [standard, extended]
          description: Configured fallback SV2 channel type
        fanrpm:
          type: number
          description: Current fan speed in RPM
        fan2rpm:
          type: number
          description: Current secondary fan speed in RPM
        fanspeed:
          type: number
          description: Current fan speed percentage
        temptarget:
          type: number
          description: Target Temperature for the PID Controller
        thermalControlMode:
          type: string
          enum: [target, curve, manual]
          description: Effective configured thermal-control mode. Legacy installations without a stored mode resolve from autofanspeed (1=target, 0=manual); curve is opt-in only.
        fanCurve:
          type: array
          items:
            $ref: '#/components/schemas/FanCurvePoint'
          minItems: 4
          maxItems: 4
          description: Configured fan curve (stored curve when valid, board-601 default otherwise; see fanCurveError)
        fanCurveHysteresis:
          type: integer
          minimum: 0
          maximum: 8
          description: Curve-mode hysteresis in °C. Downward fan transitions wait until the control temperature has cooled this far below the temperature at the last duty change; upward transitions are never delayed.
        effectiveControlTemperature:
          type: number
          description: Temperature currently feeding the active control path (EMA-smoothed max of valid ASIC temperatures); -1 when no valid reading exists
        requestedFanPercent:
          type: number
          description: Raw control decision before hysteresis and emergency overrides
        appliedFanPercent:
          type: number
          description: Fan duty actually commanded to the fan controller
        activeCurveSegment:
          type: integer
          description: Active curve segment (-1 outside curve control, 0 below the first point, 1-3 interpolating, 4 at/above the final point)
        thermalControlReason:
          type: string
          description: Human-readable reason for the current fan decision
        emergencyOverrideActive:
          type: integer
          description: Whether emergency thermal protection is forcing 100% fan (0=no, 1=yes)
        hysteresisHolding:
          type: integer
          description: Whether curve hysteresis is holding a higher duty than requested (0=no, 1=yes)
        controlSensor:
          type: string
          enum: [asic, asic2, none]
          description: Sensor currently driving the fan decision
        controlSensorValid:
          type: integer
          description: Whether the driving temperature reading is currently valid (0=no, 1=yes)
        fanCurveError:
          type: string
          description: Present only when the persisted fan curve failed validation; the control loop is running the safe target-control fallback
        responseTime:
          type: number
          description: Pool response time in ms
        responseShareBatch:
          type: number
          description: Number of shares acknowledged in the batch that produced responseTime (SV2; 1 = single share, >1 = batched ack)
        rotation:
          type: number
          description: Screen rotation setting (0, 90, 180, 270)
        cpuUsage:
          type: number
          description: CPU usage percentage
        freeHeap:
          type: number
          description: Available heap memory in bytes
        freeHeapInternal:
          type: number
          description: Available internal heap memory in bytes
        freeHeapSpiram:
          type: number
          description: Available Spiram heap memory in bytes
        frequency:
          type: number
          description: ASIC frequency in MHz
        actualFrequency:
          type: number
          description: Real-time ASIC frequency in MHz
        hashRate:
          type: number
          description: Current hashrate in Gh/s
        hashRate_1m:
          type: number
          description: Current hashrate 1m average
        hashRate_10m:
          type: number
          description: Current hashrate 10m average
        hashRate_1h:
          type: number
          description: Current hashrate 1h average
        expectedHashrate:
          type: number
          description: Expected hashrate at current voltage/frequency settings, in Gh/s
        errorPercentage:
          type: number
          description: Hash error percentage
        hostname:
          type: string
          description: Device hostname
        idfVersion:
          type: string
          description: ESP-IDF version
        invertscreen:
          type: number
          description: Screen invert setting (0=normal, 1=inverted)
        isPSRAMAvailable:
          type: number
          description: Whether PSRAM is available (0=no, 1=yes)
        isUsingFallbackStratum:
          type: number
          description: Whether using fallback stratum (0=no, 1=yes)
        macAddr:
          type: string
          description: Device MAC address
        manualFanSpeed:
          type: integer
          description: Fan speed when auto fan speed is disabled
        maxPower:
          type: integer
          description: Maxmium power draw of the board in watts
        minFanSpeed:
          type: integer
          description: Minimum fan speed percentage when using auto fan control
        nominalVoltage:
          type: integer
          description: Nominal board voltage
        overheat_mode:
          type: number
          description: Overheat protection mode
        overclockEnabled:
          type: integer
          description: Set custom voltage/frequency in AxeOS
        poolConnectionInfo:
          type: string
          description: Current pool address family
        poolDifficulty:
          type: number
          description: Current pool difficulty
        power:
          type: number
          description: Power consumption in watts
        power_fault:
          type: string
          description: Voltage regulator fault reason, if any
        hardware_fault:
          type: string
          description: Hardware/Peripheral fault reason, if any
        resetReason:
          type: string
          description: Reason for the last system reset
        runningPartition:
          type: string
          description: Currently active OTA partition
        sharesAccepted:
          type: number
          description: Number of accepted shares
        sharesRejected:
          type: number
          description: Number of rejected shares
        sharesRejectedReasons:
          type: array
          description: Reason(s) shares were rejected
          items:
            $ref: '#/components/schemas/SharesRejectedReason'
        smallCoreCount:
          type: number
          description: Number of small cores
        ssid:
          type: string
          description: Connected WiFi network SSID
        ipv4:
          type: string
          description: IPv4 address
        ipv6:
          type: string
          description: IPv6 address
        stratumExtranonceSubscribe:
          type: boolean
          description: Enable pool extranonce subscription
        stratumPort:
          type: number
          description: Primary stratum server port
        stratumProtocol:
          type: string
          enum: [SV1, SV2]
          description: Configured stratum protocol
        stratumV2AuthorityPubkey:
          type: string
          description: SV2 authority public key for certificate verification (base58-encoded)
        stratumV2ChannelType:
          type: string
          enum: [standard, extended]
          description: Configured SV2 channel type
        stratumSuggestedDifficulty:
          type: number
          description: Pool suggested difficulty
        stratumURL:
          type: string
          description: Primary stratum server URL
        stratumUser:
          type: string
          description: Primary stratum username
        stratumTLS:
          type: boolean
          description: Enable primary pool TLS
        stratumCert:
          type: string
          description: Primary stratum TLS cert
        stratumDecodeCoinbase:
          type: boolean
          description: Enable primary pool coinbase transaction decoding
        temp:
          type: number
          description: Average chip temperature
        temp2:
          type: number
          description: Average chip temperature from second sensor
        uptimeSeconds:
          type: number
          description: System uptime in seconds
        version:
          type: string
          description: Firmware version
        axeOSVersion:
          type: string
          description: AxeOS version
        productName:
          type: string
          description: NeuralAxe OS product name (additive, read-only)
        productVersion:
          type: string
          description: NeuralAxe OS product version (additive, read-only; does not replace firmware version)
        buildChannel:
          type: string
          description: NeuralAxe OS build channel (additive, read-only)
        vendor:
          type: string
          description: NeuralAxe OS vendor/project (additive, read-only)
        upstreamProject:
          type: string
          description: Upstream open-source project this build is based on
        upstreamVersion:
          type: string
          description: Upstream project version this build is based on
        targetBoard:
          type: string
          description: NeuralAxe build-target board version (declared, not runtime-detected)
        targetDevice:
          type: string
          description: NeuralAxe build-target device family (declared, not runtime-detected)
        targetAsic:
          type: string
          description: NeuralAxe build-target ASIC model (declared, not runtime-detected)
        voltage:
          type: number
          description: Input voltage
        vrTemp:
          type: number
          description: Voltage regulator temperature
        wifiStatus:
          type: string
          description: WiFi connection status
        wifiRSSI:
          type: number
          description: WiFi signal strength
        displayTimeout:
          type: number
          description: Turn off display after timeout
        statsFrequency:
          type: number
          description: Statistics frequency in seconds
        blockHeight:
          type: integer
          description: Current block height
        scriptsig:
          type: string
          description: Scriptsig extracted from coinbase transaction
        networkDifficulty:
          type: number
          description: Current network difficulty
        blockSignals:
          type: array
          description: Active block signaling (e.g., BIP-110)
          items:
            type: string
        blockFound:
          type: number
          description: Number of blocks found
        showNewBlock:
          type: boolean
          description: Whether to show the block found notification
        coinbaseOutputs:
          type: array
          description: Coinbase transaction outputs
          items:
            type: object
            title: coinbaseOutput
            required:
              - value
              - address
            properties:
              value:
                type: integer
                description: Output value in satoshis
              address:
                type: string
                description: Output address
        coinbaseValueTotalSatoshis:
          type: integer
          description: Total value of coinbase transaction in satoshis
        coinbaseValueUserSatoshis:
          type: integer
          description: User's portion of coinbase value in satoshis
        hashrateMonitor:
          type: object
          required:
            - asics
          properties:
            asics:
              type: array
              description: Hashrate register value per ASIC
              items:
                $ref: '#/components/schemas/HashrateMonitorAsic'
        miningPaused:
          type: boolean
          description: Whether mining is currently paused
        statsLimit:
          type: integer
          description: Maximum number of statistics data points

    SystemASIC:
      type: object
      required:
        - ASICModel
        - swarmColor
        - asicCount
        - deviceModel
        - defaultFrequency
        - frequencyOptions
        - defaultVoltage
        - voltageOptions
      properties:
        ASICModel:
          type: string
          description: ASIC model identifier
          enum:
            - BM1366
            - BM1368
            - BM1370
            - BM1397
          examples:
            - "BM1366"
        deviceModel:
          type: string
          description: Device model name
          examples:
            - "Ultra"
        swarmColor:
          type: string
          description: Swarm color
          examples:
            - "purple"
        asicCount:
          type: number
          description: Number of ASICs detected
        defaultFrequency:
          type: number
          description: Default frequency for the ASIC model in MHz
          examples:
            - 450
        frequencyOptions:
          type: array
          description: Available frequency options for the ASIC model in MHz
          items:
            type: number
          examples:
            - [400, 425, 450, 475, 485, 500, 525, 550, 575]
        defaultVoltage:
          type: number
          description: Default voltage for the ASIC model in millivolts
          examples:
            - 1100
        voltageOptions:
          type: array
          description: Available voltage options for the ASIC model in millivolts
          items:
            type: number
          examples:
            - [1100, 1150, 1200, 1250, 1300]

    SystemStatistics:
      type: object
      required:
        - currentTimestamp
        - labels
        - statistics
      properties:
        currentTimestamp:
          type: number
          description: Current timestamp as a reference
        labels:
          type: array
          description: Labels for statistics data value index
          items:
            type: string
        statistics:
          type: array
          description: Statistics data point(s)
          items:
            type: array
            description: Statistics data values(s)
            items:
              type: number

    SystemScoreboardEntry:
      type: object
      required:
        - difficulty
        - job_id
        - extranonce2
        - ntime
        - nonce
        - version_bits
      properties:
        rank:
          type: number
          description: Rank of the share in the scoreboard
        since:
          type: number
          description: Time since share found in seconds
        difficulty:
          type: number
          description: Difficulty of the share
        job_id:
          type: string
          description: Job ID of the share
        extranonce2:
          type: string
          description: Extranonce2 of the share
        ntime:
          type: number
          description: Ntime of the share
        nonce:
          type: string
          description: Nonce of the share
        version_bits:
          type: string
          description: Version bits of the share

    Settings:
      type: object
      properties:
        useFallbackStratum:
          type: number
          description: Forces the use the fallback stratum pool
        stratumURL:
          type: string
          description: Primary stratum server URL
          examples:
            - "stratum+tcp://pool.example.com"
        fallbackStratumURL:
          type: string
          description: Fallback stratum server URL used when primary is unavailable
          examples:
            - "stratum+tcp://backup.example.com"
        stratumUser:
          type: string
          description: Username for primary stratum server
          examples:
            - "worker1"
        stratumPassword:
          type: string
          description: Password for primary stratum server
          writeOnly: true
          examples:
            - "x"
        fallbackStratumUser:
          type: string
          description: Username for fallback stratum server
          examples:
            - "worker1"
        fallbackStratumPassword:
          type: string
          description: Password for fallback stratum server
          writeOnly: true
          examples:
            - "x"
        stratumPort:
          type: integer
          description: Port number for primary stratum server
          minimum: 1
          maximum: 65535
          examples:
            - 3333
        stratumProtocol:
          type: string
          description: Stratum protocol
          enum: [SV1, SV2]
          examples:
            - "SV1"
        stratumV2ChannelType:
          type: string
          description: SV2 channel type
          enum: [standard, extended]
          examples:
            - "standard"
        stratumV2AuthorityPubkey:
          type: string
          description: Optional SV2 authority public key for certificate verification (base58-encoded)
          pattern: "^[123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]*$"
          maxLength: 52
          examples:
            - ""
            - "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
        fallbackStratumPort:
          type: integer
          description: Port number for fallback stratum server
          minimum: 1
          maximum: 65535
          examples:
            - 3333
        fallbackStratumProtocol:
          type: string
          description: Fallback stratum protocol
          enum: [SV1, SV2]
          examples:
            - "SV1"
        fallbackStratumV2ChannelType:
          type: string
          description: Fallback SV2 channel type
          enum: [standard, extended]
          examples:
            - "standard"
        fallbackStratumV2AuthorityPubkey:
          type: string
          description: Optional fallback SV2 authority public key for certificate verification (base58-encoded)
          pattern: "^[123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]*$"
          maxLength: 52
          examples:
            - ""
        ssid:
          type: string
          description: WiFi network SSID
          minLength: 1
          maxLength: 32
          examples:
            - "MyWiFiNetwork"
        wifiPass:
          type: string
          description: WiFi network password
          writeOnly: true
          minLength: 8
          maxLength: 63
          examples:
            - "MySecurePassword123"
        hostname:
          type: string
          description: Device hostname
          pattern: "^[a-zA-Z0-9-]+$"
          examples:
            - "esp-miner-1"
        coreVoltage:
          type: integer
          description: ASIC core voltage in millivolts
          minimum: 1
          examples:
            - 850
        frequency:
          type: integer
          description: ASIC frequency in MHz
          minimum: 1
          examples:
            - 450
        rotation:
          type: integer
          description: Whether to rotate the screen orientation (0, 90, 180, 270 degrees)
          enum: [0, 1]
          examples:
            - 0
        overheat_mode:
          type: integer
          description: Overheat protection mode (0=disabled)
          enum: [0]
          examples:
            - 0
        overclockEnabled:
          type: integer
          description: Set custom voltage/frequency in AxeOS (0=disabled, 1=enabled)
          enum: [0,1]
          examples:
            - 0
        invertscreen:
          type: integer
          description: Whether to invert screen colors (0=normal, 1=inverted)
          enum: [0, 1]
          examples:
            - 0
        autofanspeed:
          type: integer
          description: Whether to enable automatic fan speed control (0=manual, 1=auto)
          enum: [0, 1]
          examples:
            - 1
        fanspeed:
          type: integer
          description: Manual fan speed percentage when autofanspeed is disabled
          minimum: 0
          maximum: 100
          examples:
            - 80
        temptarget:
          type: integer
          description: Manual Temperature Target in °C when autofanspeed is enabled
          minimum: 0
          maximum: 100
          examples:
            - 66
        thermalControlMode:
          type: string
          enum: [target, curve, manual]
          description: Thermal-control mode. Saving a mode also syncs the legacy autofanspeed flag (target/curve → 1, manual → 0) so a firmware rollback lands in the matching safe mode. Curve control is opt-in only.
          examples:
            - target
        fanCurve:
          type: array
          items:
            $ref: '#/components/schemas/FanCurvePoint'
          minItems: 4
          maxItems: 4
          description: Fan curve as exactly 4 points with strictly ascending temperatures and non-decreasing fan percentages. The firmware rejects the whole request if any point is invalid; the curve is never accepted as a free-form string.
        fanCurveHysteresis:
          type: integer
          minimum: 0
          maximum: 8
          description: Curve-mode hysteresis in °C (downward transitions only; upward fan changes are never delayed)
          examples:
            - 2
        displayTimeout:
          type: integer
          description: Set display timeout time in minutes (-1=display on, 0=display off)
          minimum: -1
          maximum: 71582
          examples:
            - 10
        statsFrequency:
          type: integer
          description: Set statistics frequency in seconds (0=disabled)
          minimum: 0
          examples:
            - 120
      additionalProperties: true

    # ---------------------------------------------------------------
    # NeuralAxe timed pool sessions — Gate B8 control plane.
    # Available ONLY when the firmware is built with
    # CONFIG_NX_TIMED_SESSIONS_API (depends on CONFIG_NX_TIMED_SESSIONS
    # and CONFIG_NX_TIMED_SESSIONS_EXECUTION; all three default to n).
    # No request carries a password, a source identity, a session id or a
    # lease token, and no response exposes a pool host, port, account,
    # worker, wallet, session id, generation or lease token.
    # ---------------------------------------------------------------

    TimedSessionCreateRequest:
      type: object
      description: |
        Bounded request for ONE unattended timed pool session.

        The SOURCE pool configuration is captured internally by the device
        and is immutable after durable session creation — a client can
        neither supply nor change it. Timed sessions are
        Keep-current-password only: a request carrying any password-like
        field is rejected before the command is queued.
      additionalProperties: false
      required:
        - duration_seconds
        - target_host
        - target_port
        - target_account
        - target_protocol
        - target_tls_mode
        - target_chain
      properties:
        duration_seconds:
          type: integer
          minimum: 900
          maximum: 86400
          description: Session duration in seconds (15 minutes to 24 hours)
          examples:
            - 3600
        target_host:
          type: string
          minLength: 1
          maxLength: 79
          description: Target pool hostname
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Target pool port
        target_account:
          type: string
          minLength: 1
          maxLength: 127
          description: Target pool account/worker (never a password)
        target_protocol:
          type: string
          enum: [stratum_v1, stratum_v2]
          description: Target Stratum protocol
        target_tls_mode:
          type: string
          enum: [disabled, bundled]
          description: |
            Target TLS mode. A custom-certificate mode is rejected: it
            cannot be restored exactly by the committed execution layer.
        target_chain:
          type: string
          enum: [bitcoin, bitcoin_cash, custom_unknown]
          description: Explicit chain label — never inferred from a hostname
        client_request_id:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: Optional bounded diagnostics identifier echoed back

    TimedSessionActionRequest:
      type: object
      description: Bounded action body for Restore Now and acknowledgement
      additionalProperties: false
      properties:
        client_request_id:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: Optional bounded diagnostics identifier echoed back

    TimedSessionAccepted:
      type: object
      description: |
        The command was queued for the single runtime owner task.
        Submission is NOT completion — the authoritative result becomes
        visible through GET /api/system/timed-session.
      required:
        - accepted
        - requestSequence
      properties:
        accepted:
          type: boolean
        requestSequence:
          type: integer
          description: Monotonic per-boot submission sequence
        clientRequestId:
          type: integer
          description: The client identifier echoed back (0 when absent)

    TimedSessionValidationError:
      type: object
      description: |
        Strict validation failure. The body carries a stable machine code
        only; the rejected value is never echoed back.
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - BODY_TOO_LARGE
            - BODY_MALFORMED
            - BODY_NOT_OBJECT
            - UNKNOWN_FIELD
            - DUPLICATE_FIELD
            - MISSING_FIELD
            - NULL_FIELD
            - TYPE_MISMATCH
            - TOO_MANY_FIELDS
            - PASSWORD_FIELD_REJECTED
            - SOURCE_FIELD_REJECTED
            - SESSION_ID_REJECTED
            - INTERNAL_FIELD_REJECTED
            - DURATION_OUT_OF_RANGE
            - HOST_EMPTY
            - HOST_TOO_LONG
            - PORT_INVALID
            - ACCOUNT_EMPTY
            - ACCOUNT_TOO_LONG
            - PROTOCOL_UNSUPPORTED
            - TLS_MODE_UNSUPPORTED
            - TLS_CUSTOM_REJECTED
            - CHAIN_UNSUPPORTED
            - REQUEST_ID_INVALID

    TimedSessionUnavailable:
      type: object
      description: The bounded command queue or the runtime is unavailable
      required:
        - accepted
        - code
      properties:
        accepted:
          type: boolean
        code:
          type: string
          enum: [QUEUE_FULL, NOT_READY]
        retryable:
          type: boolean

    OperationConflict:
      type: object
      description: |
        Sanitized ownership-conflict body. HTTP 409 is CONFLICT REPORTING
        for cooperating clients, not authentication or access control. It
        never carries a lease token, lease generation, record generation,
        session id, pool hostname, port, account, worker, wallet, password
        or raw record byte.
      required:
        - code
        - retryable
        - activeOwner
        - restoreRequired
        - terminalAckRequired
      properties:
        code:
          type: string
          enum:
            - OPERATION_ALLOWED
            - OPERATION_BUSY_TIMED_SESSION
            - OPERATION_BUSY_RESTORE
            - OPERATION_BUSY_MANUAL_POOL_CHANGE
            - OPERATION_BUSY_OTA
            - OPERATION_RECOVERY_LOCKED
            - OPERATION_BOOTSTRAP_REQUIRED
            - OPERATION_TERMINAL_ACK_REQUIRED
            - OPERATION_PERSISTENCE_UNCERTAIN
            - OPERATION_NOT_OWNER
            - OPERATION_STALE_LEASE
            - OPERATION_NO_ACTIVE_SESSION
            - OPERATION_UNSAFE_RELEASE
            - OPERATION_INVALID_REQUEST
            # Emitted by pool_operation_http_code_str()'s defensive
            # default branch. Declared here so the firmware can never
            # return a conflict code its own published schema rejects.
            - OPERATION_CODE_UNKNOWN
        retryable:
          type: boolean
        activeOwner:
          type: string
          description: Sanitized owner CLASS only
          enum:
            - OWNER_NONE
            - OWNER_TIMED_SESSION
            - OWNER_BOOT_RECOVERY
            - OWNER_SOURCE_RESTORE
            - OWNER_MANUAL_POOL_PATCH
            - OWNER_OTA_UPDATE
            - OWNER_SESSION_ACKNOWLEDGE
            - OWNER_OPERATOR_RECOVERY
            - OWNER_RECOVERY_GUARD
        restoreRequired:
          type: boolean
        terminalAckRequired:
          type: boolean

    TimedSessionStatus:
      type: object
      description: |
        Read-only sanitized timed-session status. Stable machine tokens,
        booleans and bounded numbers only — no pool host, port, account,
        worker, wallet, password, session id, lease token, lease
        generation, record generation or raw record can appear here.
      required:
        - apiEnabled
        - runtimeInitialized
        - executionEnabled
        - sessionPresent
        - terminalResultPending
        - durableState
        - runtimeState
        - leaseOwner
        - leasePhase
        - protocolStartPermitted
        - targetMiningGrantActive
        - restoreRequired
        - operatorRecoveryRequired
        - deadlineStatus
        - heartbeatStatus
        - statusSequence
      properties:
        apiEnabled:
          type: boolean
        runtimeInitialized:
          type: boolean
        executionEnabled:
          type: boolean
        sessionPresent:
          type: boolean
        terminalResultPending:
          type: boolean
        durableState:
          type: string
          description: Durable B1 session state token (e.g. IDLE, TARGET_ACTIVE)
        durableFailure:
          type: string
          description: Stable machine failure token (e.g. ERR_NONE)
        runtimeState:
          type: string
          description: Runtime posture token (e.g. RUNTIME_FREE)
        executionState:
          type: string
          description: Execution substate token (EXEC_STATE_DISABLED when off)
        executionReason:
          type: string
          description: Stable machine execution reason token
        leaseOwner:
          type: string
          description: Sanitized ownership CLASS token
        leasePhase:
          type: string
          description: Ownership phase token
        protocolStartPermitted:
          type: boolean
          description: False means protocol startup is held
        asicGate:
          type: string
          description: ASIC job-delivery gate posture token
        targetMiningGrantActive:
          type: boolean
        restoreRequired:
          type: boolean
        operatorRecoveryRequired:
          type: boolean
        trustedTimeRequired:
          type: boolean
        trustedTimeAvailable:
          type: boolean
        deadlineStatus:
          type: string
          enum: [UNKNOWN, ACTIVE, EXPIRED, RESTORE_PENDING]
        remainingSecondsValid:
          type: boolean
        remainingSeconds:
          type: integer
          description: Meaningful only when remainingSecondsValid is true
        commandPending:
          type: boolean
        pendingCommand:
          type: string
          enum: [NONE, CREATE_SESSION, RESTORE_NOW, ACKNOWLEDGE_TERMINAL]
        lastCommand:
          type: string
          enum: [NONE, CREATE_SESSION, RESTORE_NOW, ACKNOWLEDGE_TERMINAL]
        lastCommandResult:
          type: string
          description: Authoritative outcome of the last processed command
        lastClientRequestId:
          type: integer
        heartbeatStatus:
          type: string
          enum:
            - NOT_APPLICABLE
            - WAITING
            - DUE
            - COMMITTED
            - TIME_UNTRUSTED
            - PERSIST_FAILED
            - RECOVERY_GUARD
        heartbeatCommits:
          type: integer
        apiConflictCode:
          type: string
          description: Stable code of the last denied API mutation
        statusSequence:
          type: integer
          description: Bounded monotonic status sequence

  responses:
    UnauthorizedError:
      description: Unauthorized - Client not in allowed network range

    InternalError:
      description: Internal server error

    OperationConflictError:
      description: |
        Ownership conflict — a timed session, boot recovery, source
        restoration, manual pool change, OTA or the fail-closed recovery
        guard owns the resource. Conflict reporting, not authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationConflict'

paths:
  /api/system/wifi/scan:
    get:
      summary: Scan for available WiFi networks
      description: Returns a list of available WiFi networks in range
      operationId: scanWifiNetworks
      tags:
        - wifi
      responses:
        '200':
          description: Successful scan
          content:
            application/json:
              schema:
                title: SystemWifiScan
                type: object
                required:
                  - networks
                properties:
                  networks:
                    type: array
                    items:
                      $ref: '#/components/schemas/WifiNetwork'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/info:
    get:
      summary: Get system information
      description: Returns current system status and information
      operationId: getSystemInfo
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/logs:
    get:
      summary: Download system logs
      description: Returns the current system logs as a text file
      operationId: downloadSystemLogs
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/asic:
    get:
      summary: Get ASIC settings information
      description: Returns current ASIC model and corresponding available frequency and voltage options
      operationId: getAsicSettings
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemASIC'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/statistics:
    get:
      summary: Get system statistics
      description: Returns system statistics
      operationId: getSystemStatistics
      parameters:
        - in: query
          name: columns
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
            example: [hashrate,hashrate_1m,hashrate_10m,hashrate_1h,asicTemp,vrTemp,asicVoltage,voltage,power,current,fanSpeed,fanRpm,fan2Rpm,wifiRssi,freeHeap,responseTime]
          description: List of labels for which data should be retrieved
      tags:
        - system
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatistics'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/scoreboard:
    get:
      summary: Get best difficulty share scoreboard
      description: Returns top 20 best difficulty shares
      operationId: getSystemScoreboard
      tags:
        - system
      responses:
        '200':      
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemScoreboardEntry'

  /api/system/pause:
    post:
      summary: Pause mining
      description: Pauses mining activity
      operationId: pauseMining
      tags:
        - system
      responses:
        '200':
          description: Mining paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/resume:
    post:
      summary: Resume mining
      description: Resumes mining activity
      operationId: resumeMining
      tags:
        - system
      responses:
        '200':
          description: Mining resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/restart:
    post:
      summary: Restart the system
      description: Triggers a system restart
      operationId: restartSystem
      tags:
        - system
      responses:
        '200':
          description: System restart initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized - Client not in allowed network range
        '409':
          $ref: '#/components/responses/OperationConflictError'
        '500':
          description: Internal server error

  /api/system/identify:
    post:
      summary: Identify the device
      description: Let the device say Hi!
      operationId: identifySystem
      tags:
        - system
      responses:
        '200':
          description: Device identify initiated
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/GenericResponse'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system/blockFound/dismiss:
    post:
      summary: Dismiss block found notification
      description: Dismisses the block found notification while preserving the count
      operationId: dismissBlockFound
      tags:
        - system
      responses:
        '200':
          description: Block found notification dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  blockFound:
                    type: number
                    description: Number of blocks found
                  showNewBlock:
                    type: boolean
                    description: Whether to show the block found notification
                  message:
                    type: string
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error

  /api/system:
    patch:
      summary: Update system settings
      description: Updates system configuration settings
      operationId: updateSystemSettings
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings updated successfully
        '400':
          description: Invalid settings provided
        '401':
          description: Unauthorized - Client not in allowed network range
        '409':
          $ref: '#/components/responses/OperationConflictError'
        '500':
          description: Internal server error

  /api/system/OTA:
    post:
      summary: Update system firmware
      description: Upload and apply new firmware via OTA update
      operationId: updateFirmware
      tags:
        - system
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Firmware update successful
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid firmware file
        '401':
          description: Unauthorized - Client not in allowed network range
        '409':
          $ref: '#/components/responses/OperationConflictError'
        '500':
          description: Internal server error

  /api/system/OTAWWW:
    post:
      summary: Update web interface
      description: Upload and apply new web interface files
      operationId: updateWebInterface
      tags:
        - system
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Web interface update successful
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid web interface file
        '401':
          description: Unauthorized - Client not in allowed network range
        '409':
          $ref: '#/components/responses/OperationConflictError'
        '500':
          description: Internal server error

  # ---------------------------------------------------------------
  # NeuralAxe timed pool sessions — Gate B8 control plane.
  # Present ONLY in firmware built with CONFIG_NX_TIMED_SESSIONS_API
  # (default n). The handlers validate and submit BOUNDED COMMANDS to the
  # single runtime owner task: no handler applies pool configuration,
  # controls Stratum, grants ASIC mining, restarts the device or writes the
  # session store. Reachable only through the existing private-network
  # admission check; NOT user-authenticated.
  # ---------------------------------------------------------------

  /api/system/timed-session:
    get:
      summary: Get timed pool session status
      description: |
        Returns the sanitized, read-only timed-session status. It calls no
        external operation and exposes no pool identity, session id, lease
        token or generation.
      operationId: getTimedSession
      tags:
        - timed-session
      responses:
        '200':
          description: Sanitized timed-session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionStatus'
        '401':
          description: Unauthorized - Client not in allowed network range
        '500':
          description: Internal server error
    post:
      summary: Create one unattended timed pool session
      description: |
        Validates the request strictly (unknown fields, duplicate keys,
        password-like fields, client-supplied source identities, session
        ids and custom-certificate TLS all fail closed) and submits ONE
        bounded command to the runtime owner task. Acceptance means the
        command was queued, NOT that the session was created — poll the GET
        route for the authoritative result. Only one session can exist, so
        no route accepts a session id.
      operationId: createTimedSession
      tags:
        - timed-session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimedSessionCreateRequest'
      responses:
        '202':
          description: Command accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionAccepted'
        '400':
          description: Strict validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionValidationError'
        '401':
          description: Unauthorized - Client not in allowed network range
        '409':
          $ref: '#/components/responses/OperationConflictError'
        '503':
          description: Command queue or runtime temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionUnavailable'

  /api/system/timed-session/restore:
    post:
      summary: Request immediate restoration of the source pool
      description: |
        Submits a Restore Now command to the EXISTING session owner. It
        never acquires a second lease, and repeating it while restoration
        is already in progress is idempotent.
      operationId: restoreTimedSession
      tags:
        - timed-session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimedSessionActionRequest'
      responses:
        '202':
          description: Command accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionAccepted'
        '400':
          description: Strict validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionValidationError'
        '401':
          description: Unauthorized - Client not in allowed network range
        '409':
          $ref: '#/components/responses/OperationConflictError'
        '503':
          description: Command queue or runtime temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionUnavailable'

  /api/system/timed-session/acknowledge:
    post:
      summary: Acknowledge a retained safe terminal result
      description: |
        Submits an acknowledgement command. Only a COMPLETE result, or a
        safe pre-mutation CANCELLED result, with no outstanding restoration
        obligation may ever be acknowledged; the terminal state is cleared
        only after a committed tombstone has been independently read back.
        Acknowledgement never starts another session.
      operationId: acknowledgeTimedSession
      tags:
        - timed-session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimedSessionActionRequest'
      responses:
        '202':
          description: Command accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionAccepted'
        '400':
          description: Strict validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionValidationError'
        '401':
          description: Unauthorized - Client not in allowed network range
        '409':
          $ref: '#/components/responses/OperationConflictError'
        '503':
          description: Command queue or runtime temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimedSessionUnavailable'
